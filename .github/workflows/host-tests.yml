name: Host Tests

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run host tests
        run: npm test
      - name: Verify Lite toolchain files
        run: npm run verify:toolchain
      - name: Verify release invariants
        run: npm run verify:release
